id = "pullboard.needs"
name = "Pullboard: needs you"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "What needs you on the Pullboard board, with each step run in order in a new tab"
platforms = ["linux", "macos"]

[[actions]]
id = "open"
title = "Pullboard: needs you"
contexts = ["workspace"]
